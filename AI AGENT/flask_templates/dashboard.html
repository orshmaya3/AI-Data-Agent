{% extends "base.html" %}
{% block title %}Dashboard — Orbital AI{% endblock %}

{% block extra_head %}
<style>
  /* ── Full-screen loading overlay ── */
  #page-loader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity 0.55s ease;
  }
  #page-loader.done {
    opacity: 0;
    pointer-events: none;
  }

  .loader-orbital {
    position: relative;
    width: 72px; height: 72px;
  }
  /* Outer ring — slow spin */
  .loader-orbital .ring-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(120,160,255,0.18);
    animation: orbit-spin 3s linear infinite;
  }
  /* Inner ring — faster, opposite */
  .loader-orbital .ring-inner {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1.5px solid rgba(120,160,255,0.10);
    animation: orbit-spin 1.8s linear infinite reverse;
  }
  /* Orbiting dot */
  .loader-orbital .orbit-dot {
    position: absolute;
    top: -4px; left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 8px;
    background: #78a0ff;
    border-radius: 50%;
    box-shadow: 0 0 10px 3px rgba(120,160,255,0.45);
    animation: orbit-spin 3s linear infinite;
    transform-origin: 50% 40px;
  }
  /* Center planet */
  .loader-orbital .planet {
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(120,160,255,0.35), rgba(120,160,255,0.08));
    border: 1px solid rgba(120,160,255,0.25);
  }
  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  .loader-text {
    text-align: center;
    line-height: 1.6;
  }
  .loader-text .primary {
    font-size: 14px;
    font-weight: 600;
    color: #78a0ff;
    letter-spacing: 0.5px;
  }
  .loader-text .secondary {
    font-size: 11px;
    color: rgba(240,240,250,0.28);
    margin-top: 3px;
  }

  /* Pulsing dots after "Loading" */
  .loader-dots span {
    display: inline-block;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #78a0ff;
    margin: 0 1.5px;
    animation: ldot 1.4s infinite ease-in-out;
    vertical-align: middle;
  }
  .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes ldot { 0%,80%,100%{opacity:.15} 40%{opacity:1} }
</style>
{% endblock %}

{% block content %}
<!-- Loading overlay -->
<div id="page-loader">
  <div class="loader-orbital">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="orbit-dot"></div>
    <div class="planet"></div>
  </div>
  <div class="loader-text">
    <div class="primary">Loading data <span class="loader-dots"><span></span><span></span><span></span></span></div>
    <div class="secondary">Initialising agents</div>
  </div>
</div>

<!-- Upload session banner (hidden by default, shown by JS when user has own data) -->
<div id="upload-banner" style="display:none;align-items:center;justify-content:space-between;gap:.75rem;
  background:color-mix(in srgb,var(--accent,#6c63ff) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent,#6c63ff) 30%,transparent);
  border-radius:10px;padding:.6rem 1rem;margin-bottom:1rem;font-size:.85rem;">
  <span id="upload-banner-text" style="color:var(--text,#111)"></span>
  <button onclick="clearUploadSession()" style="
    background:none;border:1px solid var(--border,#d4d4d4);border-radius:6px;
    padding:.25rem .7rem;font-size:.8rem;cursor:pointer;color:var(--text-secondary,#888);
    white-space:nowrap;flex-shrink:0;">Switch to demo data</button>
</div>

<div class="page-header">
  <h1>Dashboard</h1>
  <p>Real-time retail analytics powered by autonomous AI agents</p>
</div>

<!-- KPI Grid -->
<div class="grid-4" style="margin-bottom:16px;" id="kpi-row"></div>

<!-- Charts Row 1 -->
<div class="grid-5-3" style="margin-bottom:14px;">
  <div class="chart-panel" style="min-height:300px;" id="chart-monthly"></div>
  <div class="chart-panel" style="min-height:300px;" id="chart-countries"></div>
</div>

<!-- Charts Row 2 -->
<div class="grid-3-2">
  <div class="chart-panel" style="min-height:300px;" id="chart-hourly"></div>
  <div class="chart-panel" style="min-height:300px;" id="chart-products"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* ── cached data for re-render on theme change ── */
let _kpiData = null, _chartData = null, _profileData = null;

function getColors() {
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  return dark ? {
    BG:         '#000000',
    ACCENT:     '#78a0ff',
    ACCENT_DIM: 'rgba(120,160,255,0.22)',
    FILL:       'rgba(120,160,255,0.07)',
    TEXT:       'rgba(240,240,250,0.5)',
    TITLE_C:    'rgba(240,240,250,0.8)',
    GRID:       'rgba(240,240,250,0.06)',
    LINE_C:     'rgba(240,240,250,0.08)',
    HOVER_BG:   '#111',
    HOVER_TEXT: 'rgba(240,240,250,0.9)',
    HOVER_BDR:  'rgba(120,160,255,0.4)',
    GREEN:      'rgba(74,222,128,0.85)',
    GREEN_DIM:  'rgba(74,222,128,0.22)',
  } : {
    BG:         '#e8eaf2',
    ACCENT:     '#5b7fff',
    ACCENT_DIM: 'rgba(91,127,255,0.22)',
    FILL:       'rgba(91,127,255,0.07)',
    TEXT:       'rgba(10,12,30,0.45)',
    TITLE_C:    'rgba(10,12,30,0.75)',
    GRID:       'rgba(10,12,30,0.08)',
    LINE_C:     'rgba(10,12,30,0.10)',
    HOVER_BG:   '#f7f8fd',
    HOVER_TEXT: 'rgba(10,12,30,0.9)',
    HOVER_BDR:  'rgba(91,127,255,0.4)',
    GREEN:      'rgba(22,163,74,0.85)',
    GREEN_DIM:  'rgba(22,163,74,0.22)',
  };
}

function makeLayout() {
  const c = getColors();
  return {
    paper_bgcolor: c.BG, plot_bgcolor: c.BG,
    font:  { family: 'Inter, sans-serif', color: c.TEXT, size: 11 },
    title: { font: { family: 'Inter, sans-serif', color: c.TITLE_C, size: 12, weight: 600 } },
    margin: { l: 55, r: 16, t: 44, b: 48 },
    showlegend: false,
    hoverlabel: { bgcolor: c.HOVER_BG, font: { color: c.HOVER_TEXT, family: 'Inter, sans-serif' }, bordercolor: c.HOVER_BDR },
    xaxis: { gridcolor: c.GRID, linecolor: c.LINE_C, zerolinecolor: c.LINE_C, automargin: true },
    yaxis: { gridcolor: c.GRID, linecolor: c.LINE_C, zerolinecolor: c.LINE_C, automargin: true },
  };
}

const CFG = { responsive: true, displayModeBar: false };

const KPI_DEFS = [
  { color: 'rgba(120,160,255,0.15)', text: '#78a0ff' },
  { icon: '◈', color: 'rgba(74,222,128,0.12)',  text: '#4ade80' },
  { icon: '▦', color: 'rgba(251,146,60,0.12)',  text: '#fb923c' },
  { icon: '◎', color: 'rgba(167,139,250,0.12)', text: '#a78bfa' },
];

const loader = document.getElementById('page-loader');

function renderKpis(d, profile) {
  if (!d || d.error) {
    document.getElementById('kpi-row').innerHTML =
      `<div style="grid-column:1/-1"><div class="alert-error">Could not load KPIs: ${(d && d.error) || 'Unknown error'}. <a href="/api/health" target="_blank" style="color:#a78bfa">View health status</a></div></div>`;
    return;
  }
  const sym = (profile && profile.currency_symbol) || '£';
  const mom = d.mom_growth;
  const badge = mom > 0
    ? `<span class="kpi-badge badge-up">↑ ${mom.toFixed(1)}%</span>`
    : mom < 0
      ? `<span class="kpi-badge badge-down">↓ ${Math.abs(mom).toFixed(1)}%</span>`
      : `<span class="kpi-badge badge-flat">Stable</span>`;

  const kpis = [
    { label: 'Total Revenue',   value: `${sym}${d.total_revenue.toLocaleString('en-GB', {maximumFractionDigits:0})}`, sub: badge },
    { label: 'Total Orders',    value: d.total_orders.toLocaleString(), sub: 'Unique invoices' },
    { label: 'Items Sold',      value: d.total_items.toLocaleString(), sub: 'Units dispatched' },
    { label: 'Avg Order Value', value: `${sym}${d.aov.toFixed(2)}`, sub: 'Per invoice' },
  ];

  document.getElementById('kpi-row').innerHTML = kpis.map((k, i) => {
    const def = KPI_DEFS[i];
    const icon = i === 0 ? sym : def.icon;
    return `<div class="kpi-card">
      <div class="kpi-card-icon" style="background:${def.color};color:${def.text};font-weight:700;font-size:15px">${icon}</div>
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub" style="margin-top:5px">${k.sub}</div>
    </div>`;
  }).join('');
}

function renderDataBanner(profile) {
  const banner = document.getElementById('upload-banner');
  const bannerText = document.getElementById('upload-banner-text');
  if (!banner || !bannerText) return;
  if (!profile || !profile.filename) return;   // demo data — no banner
  const parts = ['📁 ' + profile.filename];
  if (profile.row_count) parts.push(profile.row_count.toLocaleString() + ' rows');
  if (profile.date_from && profile.date_to) parts.push(profile.date_from + ' – ' + profile.date_to);
  if (profile.currency_code) parts.push(profile.currency_code);
  bannerText.textContent = parts.join(' · ');
  banner.style.display = 'flex';
}

function renderCharts(d, profile) {
  if (!d || d.error) return;
  const c   = getColors();
  const L   = makeLayout();
  const sym = (profile && profile.currency_symbol) || (d.meta && d.meta.currency_symbol) || '£';
  const meta = d.meta || {};

  const months = Object.keys(d.monthly_revenue);
  const revs   = Object.values(d.monthly_revenue);
  Plotly.newPlot('chart-monthly', [{
    x: months, y: revs, type: 'scatter', mode: 'lines',
    fill: 'tozeroy',
    line: { color: c.ACCENT, width: 2 },
    fillcolor: c.FILL,
    hovertemplate: `<b>%{x}</b><br>${sym}%{y:,.0f}<extra></extra>`,
  }], { ...L, title: { text: 'Monthly Revenue', font: { color: c.TITLE_C, size: 12 } },
        yaxis: { ...L.yaxis, tickprefix: sym } }, CFG);

  /* Chart 2: Top Countries OR Top Categories (based on data profile) */
  const hasCountry = meta.has_country !== false && Object.keys(d.top_countries || {}).length > 1;
  const chart2Data = hasCountry ? d.top_countries : d.top_products;
  const chart2Title = hasCountry
    ? 'Top 5 Countries'
    : 'Top ' + (meta.item_label || 'Categories');
  const c2_names = Object.keys(chart2Data || {});
  const c2_vals  = Object.values(chart2Data || {});
  const maxC2 = Math.max(...c2_vals, 0);
  Plotly.newPlot('chart-countries', [{
    x: c2_vals, y: c2_names.map(n => n.length > 28 ? n.slice(0,28)+'…' : n),
    type: 'bar', orientation: 'h',
    marker: { color: c2_vals.map(v => v === maxC2 ? c.ACCENT : c.ACCENT_DIM) },
    hovertemplate: `<b>%{y}</b><br>${sym}%{x:,.0f}<extra></extra>`,
  }], { ...L, title: { text: chart2Title, font: { color: c.TITLE_C, size: 12 } },
        xaxis: { ...L.xaxis, tickprefix: sym } }, CFG);

  const hours_raw = d.hourly_sales;
  const hours = Object.keys(hours_raw).sort((a,b) => parseInt(a)-parseInt(b));
  const h_vals = hours.map(h => hours_raw[h]);
  const maxH = Math.max(...h_vals);
  Plotly.newPlot('chart-hourly', [{
    x: hours, y: h_vals, type: 'bar',
    marker: { color: h_vals.map(v => v === maxH ? c.ACCENT : c.ACCENT_DIM) },
    hovertemplate: `<b>%{x}:00</b><br>${sym}%{y:,.0f}<extra></extra>`,
  }], { ...L, title: { text: 'Sales by Hour of Day', font: { color: c.TITLE_C, size: 12 } },
        yaxis: { ...L.yaxis, tickprefix: sym }, height: 300 }, CFG);

  const prod_names = Object.keys(d.top_products).map(n => n.length > 26 ? n.slice(0,26)+'…' : n);
  const prod_vals  = Object.values(d.top_products);
  const maxP = Math.max(...prod_vals);
  const prodTitle = (meta.is_categorical && !hasCountry) ? 'Revenue by Category' : 'Top Products';
  Plotly.newPlot('chart-products', [{
    x: prod_vals, y: prod_names, type: 'bar', orientation: 'h',
    marker: { color: prod_vals.map(v => v === maxP ? c.GREEN : c.GREEN_DIM) },
    hovertemplate: `<b>%{y}</b><br>${sym}%{x:,.0f}<extra></extra>`,
  }], { ...L, title: { text: prodTitle, font: { color: c.TITLE_C, size: 12 } },
        xaxis: { ...L.xaxis, tickprefix: sym }, height: 300 }, CFG);
}

/* called by base.html theme engine on every toggle */
window._dashboardSetTheme = function() {
  if (_kpiData)   renderKpis(_kpiData, _profileData);
  if (_chartData) renderCharts(_chartData, _profileData);
};

function safeFetch(url, label) {
  return fetch(url).then(r => {
    if (r.ok) return r.json().catch(() => ({ error: `${label}: response was not valid JSON (HTTP ${r.status})` }));
    return r.text().then(t => ({ error: `${label}: HTTP ${r.status} — ${t.slice(0, 300)}` }));
  }).catch(e => ({ error: `${label}: network error — ${e.message}` }));
}

Promise.all([
  safeFetch('/api/kpis',         'KPI fetch'),
  safeFetch('/api/charts',       'Charts fetch'),
  safeFetch('/api/data/profile', 'Profile fetch'),
]).then(([kpiData, chartData, profileData]) => {
  _kpiData    = kpiData;
  _chartData  = chartData;
  _profileData = profileData && !profileData.error ? profileData : null;
  try { renderKpis(kpiData, _profileData); } catch(e) {
    document.getElementById('kpi-row').innerHTML =
      `<div style="grid-column:1/-1"><div class="alert-error">KPI render error: ${e.message}. <a href="/api/health" target="_blank" style="color:#a78bfa">Health</a></div></div>`;
  }
  try { renderCharts(chartData, _profileData); } catch(e) {
    console.error('Chart render error:', e);
  }
  try { renderDataBanner(_profileData); } catch(e) {}
  loader.classList.add('done');
});

/* ── Upload session banner ── */
fetch('/api/upload/status').then(r => r.json()).then(d => {
  if (d.status === 'ready' || d.status === 'data_ready') {
    const banner = document.getElementById('upload-banner');
    const txt    = document.getElementById('upload-banner-text');
    txt.textContent = 'Analysing your uploaded data'
      + (d.rows ? ' · ' + d.rows.toLocaleString() + ' rows' : '');
    banner.style.display = 'flex';
  }
}).catch(() => {});

window.clearUploadSession = function () {
  fetch('/api/upload/session', { method: 'DELETE' }).finally(() => location.reload());
};
</script>
{% endblock %}
